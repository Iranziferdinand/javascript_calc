<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Calculator</title>

    <style>
        /* Your original styles - KEPT EXACTLY THE SAME */
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
        }

        .calculator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            width: 300px;
        }

        input {
            width: 100%;
            height: 50px;
            font-size: 25px;
            margin-bottom: 10px;
            text-align: right;
        }

        button {
            width: 60px;
            height: 50px;
            margin: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        .equal {
            background: green;
            color: white;
        }

        .clear {
            background: red;
            color: white;
        }

        /* NEW: Added styles for developer info and layout ONLY */
        .developer-info {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            color: #333;
            text-align: center;
        }

        .developer-info strong {
            color: #764ba2;
            font-size: 14px;
        }

        .how-it-works {
            margin-top: 10px;
            padding: 10px 12px;
            background: #f0f4ff;
            border-left: 3px solid #667eea;
            border-radius: 4px;
            font-size: 12px;
            color: #444;
            line-height: 1.6;
        }

        .how-it-works h4 {
            margin: 0 0 5px 0;
            color: #2d3748;
            font-size: 13px;
        }

        .how-it-works code {
            background: #e2e8f0;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 11px;
        }

        .ferdix-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 3px;
        }
    </style>

</head>

<body>

<div class="calculator">

    <!-- YOUR ORIGINAL CALCULATOR - COMPLETELY UNCHANGED -->
    <input type="text" id="display" readonly>

    <br>

    <button onclick="clearDisplay()" class="clear">C</button>
    <button onclick="deleteNumber()">DEL</button>
    <button onclick="add('/')">/</button>
    <button onclick="add('*')">*</button>

    <br>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('-')">-</button>
    

    <br>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('+')">+</button>

    <br>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="calculate()" class="equal">=</button>

    <br>

    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>

    <!-- NEW: Developer Information Section (ADDED ONLY) -->
    <div class="developer-info">
        <strong>FerdixNetwork</strong> <span class="ferdix-badge">Developer</span>
        <div style="margin-top: 3px; font-size: 11px; color: #666;">
            Built with ❤️ | Version 1.0
        </div>
    </div>

    <!-- NEW: How This Calculator Works (ADDED ONLY) -->
    <div class="how-it-works">
        <h4>📘 How It Works</h4>
        <div>
            <strong>1.</strong> Click buttons to build your expression &nbsp;|&nbsp; 
            <strong>2.</strong> Use +, -, *, / for operations<br>
            <strong>3.</strong> Press <strong>=</strong> to calculate &nbsp;|&nbsp; 
            <strong>4.</strong> <strong>C</strong> clears all &nbsp;|&nbsp; 
            <strong>DEL</strong> deletes last digit<br>
            <span style="color: #667eea; font-size: 11px;">
                ⚡ Uses JavaScript's <code>eval()</code> function for real-time calculation
            </span>
        </div>
    </div>

</div>

<!-- YOUR ORIGINAL JAVASCRIPT - COMPLETELY UNCHANGED -->
<script>

function add(value){
    document.getElementById("display").value += value;
}

function clearDisplay(){
    document.getElementById("display").value = "";
}

function deleteNumber(){
    let display = document.getElementById("display");
    display.value = display.value.slice(0,-1);
}

function calculate(){

    let result = document.getElementById("display").value;

    try{
        document.getElementById("display").value = eval(result);
    }
    catch{
        document.getElementById("display").value = "Error";
    }

}

</script>

</body>
</html>
